<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #03040a; overflow: hidden; font-family: 'Orbitron', monospace; color: #bff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 14px; left: 16px; pointer-events: none; font-size: 13px; letter-spacing: 2px; text-shadow: 0 0 8px #0ff; }
  #board { position: fixed; top: 14px; right: 16px; pointer-events: none; font-size: 12px; letter-spacing: 1px; text-align: right; line-height: 1.7; }
  #feed { position: fixed; bottom: 16px; right: 16px; pointer-events: none; font-size: 11px; text-align: right; line-height: 1.8; opacity: .85; }
  #help { position: fixed; bottom: 16px; left: 16px; pointer-events: none; font-size: 11px; letter-spacing: 1px; opacity: .6; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: 6px; text-shadow: 0 0 14px #0ff; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="board"></div>
<div id="feed"></div>
<div id="help">W/S THRUST · A/D ROTATE · SPACE FIRE</div>
<div id="status">CONNECTING…</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), board = document.getElementById('board'),
      feed = document.getElementById('feed'), statusEl = document.getElementById('status');
let W = 1600, H = 1000, myId = null;
let prev = null, curr = null, recvAt = 0, interval = 1000 / 30;
let particles = [], feedItems = [];
const socket = io();

function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resize); resize();

socket.on('connect', () => { statusEl.textContent = ''; });
socket.on('disconnect', () => { statusEl.textContent = 'SIGNAL LOST — RECONNECTING…'; });
socket.on('welcome', d => { myId = d.id; W = d.w; H = d.h; });
socket.on('state', s => {
  const now = performance.now();
  if (curr) interval = Math.min(100, Math.max(15, now - recvAt));
  prev = curr; curr = s; recvAt = now;
  for (const e of s.e) handleEvent(e);
});

function handleEvent(e) {
  if (e.t === 'hit') burst(e.x, e.y, e.color, 10, 160);
  if (e.t === 'kill') {
    burst(e.x, e.y, e.color, 50, 340);
    feedItems.unshift({ text: `${e.killer} ⟶ ${e.victim}`, t: performance.now() });
    feedItems = feedItems.slice(0, 5);
  }
}
function burst(x, y, color, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * sp;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.6, max: 1, color });
  }
}

// ---- Input ----
const keys = { up: false, down: false, left: false, right: false, fire: false };
const map = { KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right', Space: 'fire',
              ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
function setKey(e, v) {
  const k = map[e.code]; if (!k) return;
  e.preventDefault();
  if (keys[k] !== v) { keys[k] = v; socket.emit('input', keys); }
}
addEventListener('keydown', e => setKey(e, true));
addEventListener('keyup', e => setKey(e, false));
addEventListener('blur', () => { for (const k in keys) keys[k] = false; socket.emit('input', keys); });

// ---- Interpolation helpers ----
function lerpWrap(a, b, t, size) {
  let d = b - a;
  if (d > size / 2) d -= size; else if (d < -size / 2) d += size;
  let r = a + d * t; return (r + size) % size;
}
function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function interpolated() {
  if (!curr) return null;
  if (!prev) return curr.p;
  const t = Math.min(1, (performance.now() - recvAt) / interval);
  const pm = {}; for (const p of prev.p) pm[p.id] = p;
  return curr.p.map(p => {
    const o = pm[p.id];
    if (!o || !o.alive || !p.alive) return p;
    return { ...p, x: lerpWrap(o.x, p.x, t, W), y: lerpWrap(o.y, p.y, t, H), a: lerpAngle(o.a, p.a, t) };
  });
}

// ---- Rendering ----
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  const vw = cv.width, vh = cv.height;
  const scale = Math.min(vw / W, vh / H);
  const ox = (vw - W * scale) / 2, oy = (vh - H * scale) / 2;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#03040a'; ctx.fillRect(0, 0, vw, vh);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);

  drawGrid(now);

  const players = interpolated() || [];
  const me = players.find(p => p.id === myId);

  if (curr) for (const b of curr.b) drawBullet(b);
  for (const p of players) if (p.alive) drawShip(p, p.id === myId, now);

  ctx.globalCompositeOperation = 'lighter';
  particles = particles.filter(q => (q.life -= dt) > 0);
  for (const q of particles) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96;
    ctx.globalAlpha = Math.max(0, q.life);
    ctx.fillStyle = q.color; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // Arena border
  ctx.strokeStyle = 'rgba(0,240,255,0.5)'; ctx.lineWidth = 2;
  ctx.shadowColor = '#0ff'; ctx.shadowBlur = 16;
  ctx.strokeRect(0, 0, W, H); ctx.shadowBlur = 0;

  // Scanlines
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (let y = 0; y < vh; y += 4 * devicePixelRatio) ctx.fillRect(0, y, vw, devicePixelRatio);

  updateHud(me, players);
  requestAnimationFrame(frame);
}

function drawGrid(now) {
  ctx.strokeStyle = 'rgba(0,200,255,0.07)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 50) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const sweep = (now / 8) % (H + 200) - 100;
  const g = ctx.createLinearGradient(0, sweep - 80, 0, sweep);
  g.addColorStop(0, 'rgba(0,255,255,0)'); g.addColorStop(1, 'rgba(0,255,255,0.06)');
  ctx.fillStyle = g; ctx.fillRect(0, sweep - 80, W, 80);
}

function drawShip(p, isMe, now) {
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(p.a);
  ctx.shadowColor = p.color; ctx.shadowBlur = isMe ? 22 : 14;
  ctx.strokeStyle = p.color; ctx.lineWidth = 2.2;
  if (p.shield && Math.floor(now / 100) % 2) ctx.globalAlpha = 0.35;
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(-12, -12); ctx.lineTo(-6, 0); ctx.lineTo(-12, 12); ctx.closePath();
  ctx.stroke();
  ctx.fillStyle = p.color + '33'; ctx.fill();
  if (p.thrust) {
    const f = 10 + Math.random() * 10;
    ctx.beginPath(); ctx.moveTo(-8, -5); ctx.lineTo(-8 - f, 0); ctx.lineTo(-8, 5);
    ctx.strokeStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.stroke();
  }
  ctx.restore();
  if (p.shield) {
    ctx.strokeStyle = p.color + '88'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 26 + Math.sin(now / 120) * 2, 0, Math.PI * 2); ctx.stroke();
  }
  // Name + HP pips
  ctx.shadowBlur = 0;
  ctx.font = '500 11px Orbitron'; ctx.textAlign = 'center';
  ctx.fillStyle = p.color; ctx.globalAlpha = 0.85;
  ctx.fillText(isMe ? '▼ YOU' : p.name, p.x, p.y - 30);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < p.hp ? p.color : 'rgba(255,255,255,0.15)';
    ctx.fillRect(p.x - 13 + i * 9, p.y + 26, 7, 3);
  }
  ctx.globalAlpha = 1;
}

function drawBullet(b) {
  ctx.shadowColor = b.c; ctx.shadowBlur = 12;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = b.c; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0;
}

function updateHud(me, players) {
  if (me) {
    hud.innerHTML = `<span style="color:${me.color}">${me.name}</span><br>` +
      `KILLS ${me.score} · DEATHS ${me.deaths}<br>` +
      (me.alive ? '' : '<span style="color:#ff4f5e">DESTROYED — REBOOTING…</span>');
  }
  const sorted = [...players].sort((a, b) => b.score - a.score);
  board.innerHTML = `ONLINE: ${players.length}<br>` +
    sorted.map(p => `<span style="color:${p.color}">${p.id === myId ? '» ' : ''}${p.name}  ${p.score}</span>`).join('<br>');
  const now = performance.now();
  feedItems = feedItems.filter(f => now - f.t < 6000);
  feed.innerHTML = feedItems.map(f => f.text).join('<br>');
}

requestAnimationFrame(frame);
</script>
</body>
</html>
